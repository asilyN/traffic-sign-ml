version: '3.8'

services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - traffic-sign-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      - FLASK_ENV=development
      - PORT=8000
    volumes:
      - ./server:/app
    networks:
      - traffic-sign-network

networks:
  traffic-sign-network:
    driver: bridge
